[package]
name = "php-lsp-wasm"
description = "PHP completion, hover and signature help as a WASI reactor for a browser worker"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
mir-analyzer = "0.98.0"
php-lsp = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-lsp-server = "0.23"
